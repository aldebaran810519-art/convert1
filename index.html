<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPUB 橫排轉直排工具</title>
    <!-- 引入 JSZip 庫 -->
    <script src="https://cloudflare.com"></script>
    <style>
        :root {
            --primary-color: #007aff;
            --bg-color: #f5f5f7;
            --card-bg: #ffffff;
            --text-color: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
        }
        .container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-sizing: border-box;
        }
        h1 { font-size: 1.5rem; margin-bottom: 10px; }
        p { color: #666; font-size: 0.9rem; margin-bottom: 25px; }
        
        .file-input-wrapper {
            position: relative;
            margin-bottom: 20px;
        }
        .btn {
            background-color: var(--primary-color);
            color: white;
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
            box-sizing: border-box;
        }
        .btn:disabled { background-color: #bcccf6; cursor: not-allowed; }
        
        #fileInput {
            position: absolute;
            left: 0; top: 0; opacity: 0;
            width: 100%; height: 100%;
            cursor: pointer;
        }
        
        #status {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #888;
            word-break: break-all;
            min-height: 40px;
        }
        .success { color: #34c759 !important; font-weight: bold; }
        .error { color: #ff3b30 !important; }
    </style>
</head>
<body>

<div class="container">
    <h1>📚 EPUB 橫轉直工具</h1>
    <p>手機點擊下方按鈕上傳 EPUB，將自動轉換為直排（直書、右翻）並修正標點符號。</p>
    
    <div class="file-input-wrapper">
        <button class="btn" id="uploadBtn">📱 選擇 EPUB 檔案</button>
        <input type="file" id="fileInput" accept=".epub">
    </div>

    <div id="status">準備就緒，請上傳檔案</div>
</div>

<script>
const punctMap = {
    '「': '﹃', '」': '﹄',
    '『': '﹁', '』': '﹂',
    '（': '︵', '）': '︶',
    '【': '︻', '】': '︼',
    '《': '︽', '》': '︾',
    '〈': '︿', '〉': '﹀',
    '〔': '︹', '〕': '︺',
    '—': '︱',  
    '…': '︙'   
};

function replacePunctuation(text) {
    let result = text;
    for (const [horiz, vert] of Object.entries(punctMap)) {
        result = result.split(horiz).join(vert);
    }
    return result;
}

document.getElementById('fileInput').addEventListener('change', async (e) => {
    // 【修正點】精確獲取單一檔案物件
    if (!e.target.files || e.target.files.length === 0) return;
    const file = e.target.files[0]; 

    const statusDiv = document.getElementById('status');
    const uploadBtn = document.getElementById('uploadBtn');
    
    statusDiv.className = '';
    statusDiv.innerText = "⏳ 正在讀取並解析電子書...";
    uploadBtn.disabled = true;

    try {
        const zip = new JSZip();
        // 讀取上傳的電子書
        const loadedZip = await zip.loadAsync(file);
        
        const verticalCss = `\n\n/* Added by Converter */\nhtml {\n  writing-mode: vertical-rl;\n  -webkit-writing-mode: vertical-rl;\n  -epub-writing-mode: vertical-rl;\n}\n`;
        const filePromises = [];
        
        loadedZip.forEach((relativePath, zipEntry) => {
            // 處理 OPF 
            if (relativePath.endsWith('.opf')) {
                const promise = zipEntry.async('string').then(content => {
                    if (!content.includes('page-progression-direction')) {
                        content = content.replace(/<spine([^>]*)>/, '<spine$1 page-progression-direction="rtl">');
                        zip.file(relativePath, content);
                    }
                });
                filePromises.push(promise);
            }
            
            // 處理內文
            if (relativePath.match(/\.(html|xhtml|htm)$/i)) {
                const promise = zipEntry.async('string').then(content => {
                    const updatedContent = replacePunctuation(content);
                    zip.file(relativePath, updatedContent);
                });
                filePromises.push(promise);
            }

            // 處理 CSS
            if (relativePath.endsWith('.css')) {
                const promise = zipEntry.async('string').then(content => {
                    const updatedContent = content + verticalCss;
                    zip.file(relativePath, updatedContent);
                });
                filePromises.push(promise);
            }
        });

        await Promise.all(filePromises);
        statusDiv.innerText = "📦 正在打包成直排 EPUB...";

        // 重新打包確保相容性
        const newZip = new JSZip();
        if (zip.file("mimetype")) {
            const mimeContent = await zip.file("mimetype").async("string");
            newZip.file("mimetype", mimeContent, {compression: "STORE"});
        } else {
            newZip.file("mimetype", "application/epub+zip", {compression: "STORE"});
        }

        for (const [path, zipEntry] of Object.entries(zip.files)) {
            if (path === "mimetype") continue;
            const contentBlob = await zipEntry.async("blob");
            newZip.file(path, contentBlob);
        }

        const generatedBlob = await newZip.generateAsync({type: "blob", mimeType: "application/epub+zip"});
        
        // 觸發下載
        const downloadUrl = URL.createObjectURL(generatedBlob);
        const a = document.createElement('a');
        const originalName = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
        
        a.href = downloadUrl;
        a.download = `${originalName}_[直排].epub`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        statusDiv.className = 'success';
        statusDiv.innerText = "🎉 轉換成功！已自動觸發下載。";

    } catch (error) {
        console.error(error);
        statusDiv.className = 'error';
        statusDiv.innerText = `❌ 錯誤: ${error.message || '檔案解析失敗'}`;
    } finally {
        uploadBtn.disabled = false;
        document.getElementById('fileInput').value = ''; 
    }
});
</script>

</body>
</html>
