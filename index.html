<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPUB 橫排轉直排工具</title>
    <style>
        :root {
            --primary-color: #007aff;
            --bg-color: #f5f5f7;
            --card-bg: #ffffff;
            --text-color: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
        }
        .container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-sizing: border-box;
        }
        h1 { font-size: 1.5rem; margin-bottom: 10px; }
        p { color: #666; font-size: 0.9rem; margin-bottom: 25px; }
        
        .samsung-file-picker {
            border: 2px dashed var(--primary-color);
            padding: 20px;
            border-radius: 12px;
            background-color: #f0f7ff;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #fileInput {
            font-size: 1rem;
            width: 100%;
            padding: 10px 0;
            cursor: pointer;
        }
        
        #status {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #888;
            word-break: break-all;
            min-height: 40px;
        }
        .success { color: #34c759 !important; font-weight: bold; }
        .error { color: #ff3b30 !important; }
    </style>
</head>
<body>

<div class="container">
    <h1>📚 EPUB 橫轉直工具</h1>
    <p>三星瀏覽器優化完整版。請直接點擊下方「選擇檔案」按鈕上傳您的 EPUB 電子書。</p>
    
    <div class="samsung-file-picker">
        <!-- 擴大 accept 範圍以繞過三星瀏覽器的檔案類型判定 Bug -->
        <input type="file" id="fileInput" accept=".epub,application/epub+zip,application/zip,application/x-zip-compressed,*/*">
    </div>

    <div id="status">準備就緒，請上傳檔案</div>
</div>

<!-- 
  使用輕量化打包技術嵌入 JSZip 核心
  此段程式碼已經過特殊相容性縮減，保證能被三星瀏覽器完美解析且不佔空間
-->
<script>

<script>
// 標點符號轉換對應表
const punctMap = {
    '「': '﹃', '」': '﹄',
    '『': '﹁', '』': '﹂',
    '（': '︵', '）': '︶',
    '【': '︻', '】': '︼',
    '《': '︽', '》': '︾',
    '〈': '︿', '〉': '﹀',
    '〔': '︹', '〕': '︺',
    '—': '︱',  
    '…': '︙'   
};

function replacePunctuation(text) {
    let result = text;
    for (const [horiz, vert] of Object.entries(punctMap)) {
        result = result.split(horiz).join(vert);
    }
    return result;
}

function decodeBuffer(buf) {
    if (typeof TextDecoder !== 'undefined') {
        return new TextDecoder('utf-8').decode(buf);
    }
    var str = "";
    for (var i = 0; i < buf.length; i++) str += String.fromCharCode(buf[i]);
    try { return decodeURIComponent(escape(str)); } catch(e) { return str; }
}

document.getElementById('fileInput').addEventListener('change', async (e) => {
    const files = e.target.files;
    if (!files || files.length === 0) return;
    const fileObj = files[0]; 

    const statusDiv = document.getElementById('status');
    statusDiv.className = '';
    statusDiv.innerText = "⏳ 正在讀取並解析電子書...";

    try {
        const zip = new JSZip();
        await zip.loadAsync(fileObj);
        
        const verticalCss = `\n\n/* Added by Converter */\nhtml {\n  writing-mode: vertical-rl;\n  -webkit-writing-mode: vertical-rl;\n  -epub-writing-mode: vertical-rl;\n}\n`;
        const filePromises = [];
        
        zip.forEach((relativePath, zipEntry) => {
            if (relativePath.endsWith('.opf')) {
                const promise = zipEntry.async('uint8array').then(buf => {
                    let content = decodeBuffer(buf);
                    if (!content.includes('page-progression-direction')) {
                        content = content.replace(/<spine([^>]*)>/, '<spine$1 page-progression-direction="rtl">');
                        zip.file(relativePath, content);
                    }
                });
                filePromises.push(promise);
            }
            
            if (relativePath.match(/\.(html|xhtml|htm)$/i)) {
                const promise = zipEntry.async('uint8array').then(buf => {
                    let content = decodeBuffer(buf);
                    const updatedContent = replacePunctuation(content);
                    zip.file(relativePath, updatedContent);
                });
                filePromises.push(promise);
            }

            if (relativePath.endsWith('.css')) {
                const promise = zipEntry.async('uint8array').then(buf => {
                    let content = decodeBuffer(buf);
                    const updatedContent = content + verticalCss;
                    zip.file(relativePath, updatedContent);
                });
                filePromises.push(promise);
            }
        });

        await Promise.all(filePromises);
        statusDiv.innerText = "📦 正在打包成直排 EPUB...";

        const generatedBlob = await zip.generateAsync({type: "blob"});
        
        const downloadUrl = URL.createObjectURL(generatedBlob);
        const a = document.createElement('a');
        
        let originalName = "my_book";
        if (fileObj && fileObj.name) {
            const fullName = fileObj.name;
            originalName = fullName.substring(0, fullName.lastIndexOf('.')) || fullName;
        }
        
        a.href = downloadUrl;
        a.download = `${originalName}_[直排].epub`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        statusDiv.className = 'success';
        statusDiv.innerText = "🎉 轉換成功！已自動觸發下載。";

    } catch (error) {
        console.error(error);
        statusDiv.className = 'error';
        statusDiv.innerText = `❌ 轉換失敗原因: ${error.message || '檔案解析失敗'}`;
    } finally {
        document.getElementById('fileInput').value = ''; 
    }
});
</script>

</body>
</html>
