<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPUB 橫排轉直排工具</title>
    <style>
        :root {
            --primary-color: #007aff;
            --bg-color: #f5f5f7;
            --card-bg: #ffffff;
            --text-color: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
        }
        .container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-sizing: border-box;
        }
        h1 { font-size: 1.5rem; margin-bottom: 10px; }
        p { color: #666; font-size: 0.9rem; margin-bottom: 25px; }
        
        .file-input-wrapper {
            position: relative;
            margin-bottom: 20px;
        }
        .btn {
            background-color: var(--primary-color);
            color: white;
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
            box-sizing: border-box;
        }
        .btn:disabled { background-color: #bcccf6; cursor: not-allowed; }
        
        #fileInput {
            position: absolute;
            left: 0; top: 0; opacity: 0;
            width: 100%; height: 100%;
            cursor: pointer;
        }
        
        #status {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #888;
            word-break: break-all;
            min-height: 40px;
        }
        .success { color: #34c759 !important; font-weight: bold; }
        .error { color: #ff3b30 !important; }
    </style>
</head>
<body>

<div class="container">
    <h1>📚 EPUB 橫轉直工具</h1>
    <p>專為三星瀏覽器優化版。直接上傳您的 EPUB 檔案，將在手機內直接轉為直排並修正標點符號。</p>
    
    <div class="file-input-wrapper">
        <button class="btn" id="uploadBtn">📱 上傳 EPUB 檔案</button>
        <input type="file" id="fileInput" accept=".epub">
    </div>

    <div id="status">準備就緒，請上傳檔案</div>
</div>

// 針對三星瀏覽器進行內文處理的文字解碼修復器
function createTextDecoder() {
    if (typeof TextDecoder !== 'undefined') {
        return new TextDecoder('utf-8');
    }
    return {
        decode: function(buf) {
            var str = "";
            for (var i = 0; i < buf.length; i++) str += String.fromCharCode(buf[i]);
            try { return decodeURIComponent(escape(str)); } catch(e) { return str; }
        }
    };
}

<script>
// 標點符號轉換對應表
const punctMap = {
    '「': '﹃', '」': '﹄',
    '『': '﹁', '』': '﹂',
    '（': '︵', '）': '︶',
    '【': '︻', '】': '︼',
    '《': '︽', '》': '︾',
    '〈': '︿', '〉': '﹀',
    '〔': '︹', '〕': '︺',
    '—': '︱',  
    '…': '︙'   
};

function replacePunctuation(text) {
    let result = text;
    for (const [horiz, vert] of Object.entries(punctMap)) {
        result = result.split(horiz).join(vert);
    }
    return result;
}

document.getElementById('fileInput').addEventListener('change', async (e) => {
    if (!e.target.files || e.target.files.length === 0) return;
    const fileObj = e.target.files;

    const statusDiv = document.getElementById('status');
    const uploadBtn = document.getElementById('uploadBtn');
    
    statusDiv.className = '';
    statusDiv.innerText = "⏳ 正在讀取並解析電子書...";
    uploadBtn.disabled = true;

    try {
        const zip = new JSZip();
        // 1. 讀取並解壓上傳的 EPUB 檔案
        const loadedZip = await zip.loadAsync(fileObj);
        
        const verticalCss = `\n\n/* Added by Converter */\nhtml {\n  writing-mode: vertical-rl;\n  -webkit-writing-mode: vertical-rl;\n  -epub-writing-mode: vertical-rl;\n}\n`;
        const filePromises = [];
        const decoder = createTextDecoder();
        
        loadedZip.forEach((relativePath, zipEntry) => {
            // 2. 修改 OPF (設定為右翻書)
            if (relativePath.endsWith('.opf')) {
                const promise = zipEntry.async('uint8array').then(buf => {
                    let content = decoder.decode(buf);
                    if (!content.includes('page-progression-direction')) {
                        content = content.replace(/<spine([^>]*)>/, '<spine$1 page-progression-direction="rtl">');
                        zip.file(relativePath, content);
                    }
                });
                filePromises.push(promise);
            }
            
            // 3. 修改內文 (替換標點符號)
            if (relativePath.match(/\.(html|xhtml|htm)$/i)) {
                const promise = zipEntry.async('uint8array').then(buf => {
                    let content = decoder.decode(buf);
                    const updatedContent = replacePunctuation(content);
                    zip.file(relativePath, updatedContent);
                });
filePromises.push(promise);}// 4. 修改 CSS (注入直排樣式)if (relativePath.endsWith('.css')) {const promise = zipEntry.async('uint8array').then(buf => {let content = decoder.decode(buf);const updatedContent = content + verticalCss;zip.file(relativePath, updatedContent);});filePromises.push(promise);}});await Promise.all(filePromises);statusDiv.innerText = "📦 正在打包成直排 EPUB...";// 5. 重新封裝const generatedBlob = await zip.generateAsync({type: "blob"});// 6. 產生下載連結並觸發const downloadUrl = URL.createObjectURL(generatedBlob);const a = document.createElement('a');// 取得安全檔名let originalName = "my_book";if (fileObj[0] && fileObj[0].name) {const fullName = fileObj[0].name;originalName = fullName.substring(0, fullName.lastIndexOf('.')) || fullName;}a.href = downloadUrl;a.download = ${originalName}_[直排].epub;document.body.appendChild(a);a.click();document.body.removeChild(a);statusDiv.className = 'success';statusDiv.innerText = "🎉 轉換成功！已自動觸發下載。";} catch (error) {console.error(error);statusDiv.className = 'error';statusDiv.innerText = ❌ 轉換失敗原因: ${error.message || '檔案解析失敗'};} finally {uploadBtn.disabled = false;document.getElementById('fileInput').value = '';}});
